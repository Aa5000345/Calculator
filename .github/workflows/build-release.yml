name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib pytest

      - name: Check i18n consistency
        run: python scripts/check_i18n.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Generate default icon if missing
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "assets/icon.ico not found; generating..."
            python scripts/make_icon.py
          } else {
            Write-Host "assets/icon.ico exists; skipping generation"
          }

      - name: Build with PyInstaller
        run: pyinstaller MultiCalc.spec --clean --noconfirm

      - name: List dist
        run: dir dist

      - name: Package exe
        run: Compress-Archive -Path dist\MultiCalc.exe -DestinationPath MultiCalc-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiCalc-Windows
          path: MultiCalc-Windows.zip

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: MultiCalc-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
